<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-squircle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEADB" />
      <stop offset="50%" stop-color="#FFE6D5" />
      <stop offset="100%" stop-color="#FFE0CE" />
    </linearGradient>

    <!-- Caustic Shadows & Halos -->
    <radialGradient id="caustic-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6A98A" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#E6A98A" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#E6A98A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="caustic-amber-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD56B" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#FFB300" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E6A98A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="caustic-mint-glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CFFD0" stop-opacity="0.50" />
      <stop offset="60%" stop-color="#00E5A3" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#00E5A3" stop-opacity="0" />
    </radialGradient>

    <!-- Milky Glass Core Body Gradients -->
    <linearGradient id="glass-milky-top" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.70" />
      <stop offset="40%" stop-color="#DDF7F2" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#FFF8EE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="glass-milky-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#DDF7F2" stop-opacity="0.40" />
      <stop offset="75%" stop-color="#FFF8EE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="glass-milky-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#DDF7F2" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#FFD56B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.20" />
    </linearGradient>

    <!-- Rear Internal Planes -->
    <linearGradient id="glass-rear-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#DDF7F2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#E6A98A" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="glass-rear-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFD56B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="glass-rear-floor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E6A98A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.22" />
    </linearGradient>

    <!-- Prismatic Spectral Dispersion Gradients -->
    <linearGradient id="prismatic-mint-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CFFD0" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#00E5A3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00E5A3" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="prismatic-amber-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD56B" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#FFB300" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="prismatic-coral-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A" stop-opacity="0.70" />
      <stop offset="55%" stop-color="#FF6B4A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="opal-rib-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60" />
      <stop offset="50%" stop-color="#DDF7F2" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#FFF8EE" stop-opacity="0.10" />
    </linearGradient>

    <!-- Gemstone Facet Specific Fills -->
    <linearGradient id="facet-top-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#DDF7F2" stop-opacity="0.55" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="facet-left-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.70" />
      <stop offset="50%" stop-color="#DDF7F2" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#FFF8EE" stop-opacity="0.30" />
    </linearGradient>

    <linearGradient id="facet-right-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50" />
      <stop offset="45%" stop-color="#FFD56B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFA07A" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="gem-facet-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="facet-nw-key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#DDF7F2" stop-opacity="0.45" />
    </linearGradient>

    <!-- Soft Caustic Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- LAYER 1: M3 Expressive Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-squircle)" />
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.45" />

  <!-- LAYER 2: Ground Occlusion & Caustic Halo -->
  <g id="ground-caustics">
    <ellipse cx="264" cy="422" rx="140" ry="32" fill="url(#caustic-shadow)" />
    <ellipse cx="274" cy="418" rx="85" ry="18" fill="url(#caustic-amber-halo)" filter="url(#soft-glow)" />
    <ellipse cx="254" cy="422" rx="55" ry="12" fill="url(#caustic-mint-glint)" filter="url(#soft-glow)" />
    <ellipse cx="276" cy="406" rx="42" ry="9" fill="#D68F6C" opacity="0.45" filter="url(#soft-glow)" />
  </g>

  <!-- ROTATED GEM-CUBE VOLUME: +8 DEGREE COUNTER-CLOCKWISE TILT -->
  <g id="gem-cube" transform="rotate(-8 256 260)">

    <!-- LAYER 3: Rear Internal Facets & Refractive Ribs -->
    <g id="rear-internal-geometry">
      <!-- Rear Planes -->
      <polygon points="256,118 132,190 132,330 268,238" fill="url(#glass-rear-left)" />
      <polygon points="256,118 380,190 380,330 268,238" fill="url(#glass-rear-right)" />
      <polygon points="132,330 256,402 380,330 268,238" fill="url(#glass-rear-floor)" />

      <!-- 45-Degree Internal Refraction Ribs -->
      <polygon points="160,185 180,170 290,280 270,295" fill="url(#prismatic-mint-beam)" stroke="#5CFFD0" stroke-width="0.8" stroke-opacity="0.4" />
      <polygon points="190,165 210,150 320,260 300,275" fill="url(#opal-rib-sheen)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
      <polygon points="140,225 160,210 270,320 250,335" fill="url(#prismatic-amber-beam)" stroke="#FFD56B" stroke-width="0.8" stroke-opacity="0.4" />
      <polygon points="220,185 240,170 345,275 325,290" fill="url(#prismatic-mint-beam)" stroke="#00E5A3" stroke-width="0.8" stroke-opacity="0.35" />
      <polygon points="175,255 195,240 295,340 275,355" fill="url(#prismatic-coral-edge)" stroke="#FF6B4A" stroke-width="0.8" stroke-opacity="0.35" />
    </g>

    <!-- LAYER 4: Core Translucent Body Volume Blocks -->
    <g id="core-body-blocks">
      <polygon points="256,118 380,190 256,260 132,190" fill="url(#glass-milky-top)" />
      <polygon points="132,190 256,260 256,402 132,330" fill="url(#glass-milky-left)" />
      <polygon points="256,260 380,190 380,330 256,402" fill="url(#glass-milky-right)" />
    </g>

    <!-- LAYER 5: Front Gemstone Facet Cuts & Spectral Dispersion Wedges -->
    <g id="gemstone-facets">
      <!-- TOP FACE FACETS -->
      <polygon points="256,154 320,190 256,226 192,190" fill="url(#facet-top-table)" />

      <!-- NW Chamfers (Key Light Catchers) -->
      <polygon points="132,190 256,118 192,190" fill="url(#gem-facet-sheen)" />
      <polygon points="256,118 256,154 192,190" fill="url(#facet-nw-key)" />

      <!-- NE Chamfers (Prismatic Emerald / Mint Spectral Wedge) -->
      <polygon points="256,118 380,190 320,190" fill="url(#prismatic-mint-beam)" />
      <polygon points="256,118 256,154 320,190" fill="url(#prismatic-mint-beam)" opacity="0.85" />

      <!-- SE Chamfers (Prismatic Amber Transition) -->
      <polygon points="380,190 256,260 320,190" fill="url(#prismatic-amber-beam)" />
      <polygon points="256,260 256,226 320,190" fill="url(#prismatic-amber-beam)" opacity="0.75" />

      <!-- SW Chamfers (Champagne Opal Transition) -->
      <polygon points="256,260 132,190 192,190" fill="url(#opal-rib-sheen)" />
      <polygon points="256,260 256,226 192,190" fill="url(#glass-milky-top)" />

      <!-- LEFT FACE FACETS -->
      <polygon points="194,240 226,296 194,352 162,296" fill="url(#facet-left-table)" />

      <!-- Upper Bevel Facets -->
      <polygon points="132,190 256,260 194,240" fill="url(#gem-facet-sheen)" opacity="0.85" />
      <polygon points="256,260 226,296 194,240" fill="#FFFFFF" fill-opacity="0.45" />

      <!-- Center-Right Vertical Spine (Amber Topaz Dispersion Accent) -->
      <polygon points="256,260 256,402 194,352" fill="url(#prismatic-amber-beam)" opacity="0.65" />
      <polygon points="256,260 226,296 194,352" fill="url(#opal-rib-sheen)" opacity="0.55" />

      <!-- Lower Bevel Facets -->
      <polygon points="256,402 132,330 194,352" fill="#E6A98A" fill-opacity="0.30" />
      <polygon points="132,330 162,296 194,352" fill="#FFF8EE" fill-opacity="0.40" />

      <!-- Outer-Left Bevel Facets -->
      <polygon points="132,330 132,190 194,240" fill="#FFFFFF" fill-opacity="0.45" />
      <polygon points="132,330 194,240 162,296" fill="url(#opal-rib-sheen)" opacity="0.60" />

      <!-- RIGHT FACE FACETS -->
      <polygon points="318,240 350,296 318,352 286,296" fill="url(#facet-right-table)" />

      <!-- Upper Chamfers -->
      <polygon points="256,260 380,190 318,240" fill="url(#prismatic-amber-beam)" opacity="0.55" />
      <polygon points="256,260 318,240 286,296" fill="#FFFFFF" fill-opacity="0.30" />

      <!-- Outer-East Rim Facets (Luminous Coral / Sunrise Vermilion Accent) -->
      <polygon points="380,190 380,330 350,296" fill="url(#prismatic-coral-edge)" />
      <polygon points="380,190 350,296 318,240" fill="url(#prismatic-amber-beam)" opacity="0.70" />

      <!-- Lower Chamfers (Warm Ground Bounce) -->
      <polygon points="380,330 256,402 318,352" fill="url(#prismatic-coral-edge)" opacity="0.80" />
      <polygon points="380,330 318,352 350,296" fill="url(#prismatic-amber-beam)" opacity="0.50" />

      <!-- Center-Left Facets (Meeting Front Vertical Spine) -->
      <polygon points="256,402 256,260 286,296" fill="#FFD56B" fill-opacity="0.35" />
      <polygon points="256,402 286,296 318,352" fill="#FF8A65" fill-opacity="0.30" />
    </g>

    <!-- LAYER 6: Diamond Bevels, Light-Catching Vector Strokes & Specular Glints -->
    <g id="bevel-strokes-and-highlights">
      <!-- Facet Inner Chamfer Strokes -->
      <line x1="256" y1="118" x2="256" y2="154" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.75" />
      <line x1="256" y1="118" x2="192" y2="190" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="256" y1="118" x2="320" y2="190" stroke="#5CFFD0" stroke-width="1.6" stroke-opacity="0.70" />
      <line x1="256" y1="260" x2="192" y2="190" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.60" />
      <line x1="256" y1="260" x2="320" y2="190" stroke="#FFD56B" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="256" y1="260" x2="256" y2="226" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65" />
      <polygon points="256,154 320,190 256,226 192,190" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.75" stroke-linejoin="round" />

      <line x1="132" y1="190" x2="194" y2="240" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="256" y1="260" x2="194" y2="240" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.70" />
      <line x1="256" y1="402" x2="194" y2="352" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.55" />
      <line x1="132" y1="330" x2="194" y2="352" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.55" />
      <polygon points="194,240 226,296 194,352 162,296" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.60" stroke-linejoin="round" />

      <line x1="380" y1="190" x2="318" y2="240" stroke="#5CFFD0" stroke-width="1.5" stroke-opacity="0.60" />
      <line x1="256" y1="260" x2="318" y2="240" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="380" y1="330" x2="350" y2="296" stroke="#FFA07A" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="380" y1="330" x2="318" y2="352" stroke="#FF6B4A" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="256" y1="402" x2="318" y2="352" stroke="#FFB300" stroke-width="1.5" stroke-opacity="0.60" />
      <polygon points="318,240 350,296 318,352 286,296" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.55" stroke-linejoin="round" />

      <!-- Outer Silhouette -->
      <polygon points="256,118 380,190 380,330 256,402 132,330 132,190" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.75" stroke-linejoin="round" />

      <!-- Primary Y-Spine Edges -->
      <line x1="256" y1="260" x2="132" y2="190" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.85" stroke-linecap="round" />
      <line x1="256" y1="260" x2="380" y2="190" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.85" stroke-linecap="round" />
      <line x1="256" y1="260" x2="256" y2="402" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.90" stroke-linecap="round" />

      <!-- Directional Key Light Specular Bars (45° angle) -->
      <line x1="172" y1="174" x2="228" y2="138" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.95" />
      <line x1="184" y1="182" x2="216" y2="162" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" stroke-opacity="0.80" />
      <line x1="142" y1="216" x2="154" y2="252" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.85" />
      <line x1="224" y1="182" x2="274" y2="160" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />

      <!-- Specular 4-Point Micro-Sparkle Stars -->
      <!-- Peak Crown Star -->
      <path d="M 256 102 Q 256 118 272 118 Q 256 118 256 134 Q 256 118 240 118 Q 256 118 256 102 Z" fill="#FFFFFF" opacity="0.95" />
      <circle cx="256" cy="118" r="2.5" fill="#FFFFFF" />

      <!-- Center Junction Star -->
      <path d="M 256 244 Q 256 260 272 260 Q 256 260 256 276 Q 256 260 240 260 Q 256 260 256 244 Z" fill="#FFFFFF" />
      <circle cx="256" cy="260" r="3" fill="#FFFFFF" />

      <!-- East Peak Star -->
      <path d="M 380 178 Q 380 190 392 190 Q 380 190 380 202 Q 380 190 368 190 Q 380 190 380 178 Z" fill="#FFFFFF" opacity="0.90" />
      <circle cx="380" cy="190" r="2" fill="#FFFFFF" />

      <!-- Micro-Glints -->
      <path d="M 320 183 Q 320 190 327 190 Q 320 190 320 197 Q 320 190 313 190 Q 320 190 320 183 Z" fill="#FFFFFF" opacity="0.85" />
      <path d="M 194 233 Q 194 240 201 240 Q 194 240 194 247 Q 194 240 187 240 Q 194 240 194 233 Z" fill="#FFFFFF" opacity="0.80" />
    </g>
  </g>
</svg>
